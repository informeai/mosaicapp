name: Build (macOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  WAILS_VERSION: v2.10.2

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp app version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build universal binary (amd64 + arm64)
        run: wails build -platform darwin/universal -clean

      - name: Ad-hoc code sign
        # No paid Apple Developer certificate is configured, so this signs
        # locally (ad-hoc) rather than for notarized distribution. Gatekeeper
        # will still warn on first launch of a downloaded build; that's
        # expected without a Developer ID + notarization step.
        run: codesign --force --deep --sign - "build/bin/Mosaic.app"

      - name: Package
        env:
          ASSET: mosaic-${{ steps.version.outputs.version }}-macos-universal.zip
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent Mosaic.app "$ASSET"
          echo "ASSET=build/bin/$ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-macos-universal
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
