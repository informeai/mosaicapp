name: Build (Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para nomear o artefato (ex.: 1.0.0)"
        required: false
        default: "0.0.0"

env:
  WAILS_VERSION: v2.10.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        # webkit2_41: Ubuntu's current webkit2gtk package is 4.1, not the
        # 4.0 that Wails links against by default.
        run: wails build -tags webkit2_41 -platform linux/amd64 -clean

      - name: Package
        env:
          ASSET: mosaic-${{ inputs.version }}-linux-amd64.tar.gz
        run: |
          cd build/bin
          chmod +x mosaicapp
          tar -czf "$ASSET" mosaicapp
          echo "ASSET=build/bin/$ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-linux-amd64
          path: ${{ env.ASSET }}
