name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex.: 1.0.0) — cria/atualiza a release vX.Y.Z"
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v2.10.2

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        # webkit2_41: Ubuntu's current webkit2gtk package is 4.1, not the
        # 4.0 that Wails links against by default.
        run: wails build -tags webkit2_41 -platform linux/amd64 -clean

      - name: Package
        env:
          ASSET: mosaic-${{ inputs.version }}-linux-amd64.tar.gz
        run: |
          cd build/bin
          chmod +x mosaicapp
          tar -czf "$ASSET" mosaicapp
          echo "ASSET=build/bin/$ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-linux-amd64
          path: ${{ env.ASSET }}

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Mosaic v${{ inputs.version }}
          files: ${{ env.ASSET }}

  build-macos:
    needs: build-linux
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Stamp app version
        run: |
          jq --arg v "${{ inputs.version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build universal binary (amd64 + arm64)
        run: wails build -platform darwin/universal -clean

      - name: Ad-hoc code sign
        # No paid Apple Developer certificate is configured, so this signs
        # locally (ad-hoc) rather than for notarized distribution. Gatekeeper
        # will still warn on first launch of a downloaded build; that's
        # expected without a Developer ID + notarization step.
        run: codesign --force --deep --sign - "build/bin/Mosaic.app"

      - name: Package
        env:
          ASSET: mosaic-${{ inputs.version }}-macos-universal.zip
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent Mosaic.app "$ASSET"
          echo "ASSET=build/bin/$ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-macos-universal
          path: ${{ env.ASSET }}

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Mosaic v${{ inputs.version }}
          files: ${{ env.ASSET }}

  build-windows:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up .NET (for WiX)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install WiX Toolset
        shell: bash
        run: |
          dotnet tool install --global wix
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Stamp app version
        shell: bash
        run: |
          jq --arg v "${{ inputs.version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build
        run: wails build -platform windows/amd64 -clean

      - name: Build MSI installer with WiX
        shell: bash
        env:
          MSI_ASSET: mosaic-${{ inputs.version }}-windows-amd64.msi
        run: |
          wix build build/windows/installer/mosaic.wxs \
            -arch x64 \
            -d ProductVersion="${{ inputs.version }}" \
            -d BuildDir="build/bin" \
            -d IconPath="build/windows/icon.ico" \
            -out "build/bin/$MSI_ASSET"
          echo "MSI_ASSET=build/bin/$MSI_ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-windows-amd64
          path: |
            build/bin/mosaicapp.exe
            ${{ env.MSI_ASSET }}

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Mosaic v${{ inputs.version }}
          files: |
            build/bin/mosaicapp.exe
            ${{ env.MSI_ASSET }}
