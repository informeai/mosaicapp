name: Build (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  WAILS_VERSION: v2.10.2

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up .NET (for WiX)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install WiX Toolset
        shell: bash
        run: |
          dotnet tool install --global wix
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp app version
        shell: bash
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build
        run: wails build -platform windows/amd64 -clean

      - name: Build MSI installer with WiX
        shell: bash
        env:
          MSI_ASSET: mosaic-${{ steps.version.outputs.version }}-windows-amd64.msi
        run: |
          wix build build/windows/installer/mosaic.wxs \
            -arch x64 \
            -d ProductVersion="${{ steps.version.outputs.version }}" \
            -d BuildDir="build/bin" \
            -d IconPath="build/windows/icon.ico" \
            -out "build/bin/$MSI_ASSET"
          echo "MSI_ASSET=build/bin/$MSI_ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-windows-amd64
          path: |
            build/bin/mosaicapp.exe
            ${{ env.MSI_ASSET }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/mosaicapp.exe
            ${{ env.MSI_ASSET }}
