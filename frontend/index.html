<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mosaic</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
    <header class="topbar">
        <div class="brand">
            <span class="brand-tiles" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
            </span>
            <div>
                <h1>Mosaic</h1>
                <p>Deduplicação de arquivos offline</p>
            </div>
        </div>
        <button id="upload-btn" class="btn-primary">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M12 3l5 5h-3v6h-4V8H7l5-5zM5 19h14v2H5z"/>
            </svg>
            Enviar arquivo
        </button>
    </header>

    <main>
        <section id="empty-state" class="empty-state" hidden>
            <p>Nenhum arquivo enviado ainda.</p>
            <p class="muted">Clique em "Enviar arquivo" para começar a deduplicar.</p>
        </section>

        <section id="file-grid" class="file-grid" aria-live="polite"></section>
    </main>

    <div id="toast" class="toast" hidden></div>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
